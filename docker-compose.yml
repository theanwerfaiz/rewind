services:
  rewind:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      REWIND_CAPTURE_URL: http://localhost:3000/api/events

    volumes:
      - rewind-data:/app/data

    restart: unless-stopped

volumes:
  rewind-data:
