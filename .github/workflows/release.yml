name: Release

# Publishes a GitHub release whose notes are the version's section of
# CHANGELOG.md. Either push a tag such as v0.2.0, or run this workflow
# from the Actions tab: it then tags the current commit with the version
# in package.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)." >&2
            exit 1
          fi
          echo "TAG=$expected" >> "$GITHUB_ENV"

      - name: Extract the release notes
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version." >&2
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$TAG" --title "Rewind $TAG" --notes-file notes.md --verify-tag
          else
            # Creates the tag on this commit as part of the release.
            gh release create "$TAG" --title "Rewind $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
